log4j.rootLogger=DEBUG, CONSOLE, FILE

# Console Appender
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss}] %p %c{1}: %m%n

# File Appender - Rolling daily
log4j.appender.FILE=org.apache.log4j.DailyRollingFileAppender
log4j.appender.FILE.File=logs/burpai-pro.log
log4j.appender.FILE.DatePattern='.'yyyy-MM-dd
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss}] %p %c{1}: %m%n
log4j.appender.FILE.Append=true

# BurpAI Pro logging - DEBUG level for all modules
log4j.logger.com.burpai=DEBUG
log4j.logger.com.burpai.ai=DEBUG
log4j.logger.com.burpai.api=DEBUG
log4j.logger.com.burpai.workers=DEBUG
log4j.logger.com.burpai.ui=DEBUG

# Silence verbose libraries
log4j.logger.org.apache.http=WARN
log4j.logger.org.apache.http.wire=ERROR
